<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduCraft — bonuslar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f2f4f8);
    --card: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #101828);
    --muted: var(--tg-theme-hint-color, #667085);
    --brand: #1d4ed8;
    --brand-2: #3b82f6;
    --gold: #f59e0b;
    --ok: #16a34a;
    --line: rgba(120, 130, 150, .22);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; display: grid; gap: 12px; }
  .brand { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; }
  .brand b { font-size: 15px; letter-spacing: .2px; color: var(--muted); font-weight: 600; }
  .badge {
    font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
    background: rgba(245, 158, 11, .16); color: #b45309;
  }
  .hero {
    border-radius: 20px; padding: 20px; color: #fff;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
  }
  .hero small { display: block; opacity: .85; font-size: 14px; }
  .hero .sum { font-size: 38px; font-weight: 800; letter-spacing: -.5px; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .hero .sum span { font-size: 18px; font-weight: 600; opacity: .9; margin-left: 4px; }
  .hero p { font-size: 13.5px; opacity: .9; margin-top: 8px; }
  .card { background: var(--card); border-radius: 18px; padding: 16px; }
  h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; }
  /* daraja */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 10px; }
  .step { text-align: center; }
  .step i { display: block; height: 8px; border-radius: 999px; background: var(--line); margin-bottom: 6px; }
  .step.done i { background: var(--brand-2); }
  .step.now i { background: var(--gold); }
  .step b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .step span { font-size: 11.5px; color: var(--muted); }
  .step.now b { color: #b45309; }
  .note { font-size: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(59, 130, 246, .10); }
  /* sovg'a qutisi */
  .gift { display: flex; align-items: center; gap: 16px; }
  .ring { position: relative; width: 92px; height: 92px; flex: none; }
  .ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
  .ring em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 30px; }
  .gift .amount { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .gift .amount span { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 3px; }
  /* qoidalar */
  ol { list-style: none; display: grid; gap: 10px; margin-top: 10px; padding: 0; }
  ol li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 14.5px; }
  ol li b {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(59, 130, 246, .14); color: var(--brand); font-size: 14px;
  }
  .foot { text-align: center; color: var(--muted); font-size: 12.5px; padding: 2px 8px; }
  button {
    width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 700;
    color: var(--tg-theme-button-text-color, #fff); background: var(--tg-theme-button-color, var(--brand));
  }
  @media (prefers-reduced-motion: reduce) { .ring .bar { transition: none; } }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--tg-theme-secondary-bg-color, #0f1420);
      --card: var(--tg-theme-bg-color, #1a2030);
      --text: var(--tg-theme-text-color, #f1f5f9);
      --muted: var(--tg-theme-hint-color, #94a3b8);
    }
  }
  .dark .badge, .dark .step.now b { color: #fbbf24; }
  .dark ol li b { color: #93c5fd; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>EduCraft</b><span class="badge" id="level"></span></div>

  <section class="hero">
    <small id="t-balance"></small>
    <div class="sum"><b id="bal"></b><span id="cur1"></span></div>
    <p id="t-balance-note"></p>
  </section>

  <section class="card">
    <h2 id="t-level-title"></h2>
    <div class="sub" id="t-level-sub"></div>
    <div class="steps" id="steps"></div>
    <div class="note" id="next"></div>
  </section>

  <section class="card">
    <h2 id="t-box-title"></h2>
    <div class="gift" style="margin-top:10px">
      <div class="ring">
        <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="bar" id="bar" cx="50" cy="50" r="42"/></svg>
        <em>🎁</em>
      </div>
      <div>
        <div class="amount"><b id="box"></b><span id="cur2"></span></div>
        <div class="sub" id="box-left"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2 id="t-how"></h2>
    <ol id="rules"></ol>
  </section>

  <button id="close"></button>
  <div class="foot" id="foot"></div>
</div>

<script>
const I18N = {
  uz: {
    cur: "so'm", levels: ["Yangi mijoz", "Doimiy mijoz", "Ishonchli mijoz", "VIP mijoz"],
    balance: "Ishlatish mumkin bo'lgan bonus",
    balanceNote: "Keyingi buyurtmangizda avtomatik chegirma bo'lib ishlaydi (narxning {ms}% igacha).",
    levelTitle: "Sizning chegirmangiz", levelSub: "Qancha ko'p buyurtma bersangiz, chegirma shuncha katta.",
    order: "{n}-buyurtma", orderPlus: "{n}+ buyurtma",
    next: "Hozir chegirmangiz <b>{pct}%</b>. Yana <b>{left}</b> ta buyurtmadan so'ng <b>{np}%</b> bo'ladi.",
    max: "Siz eng yuqori darajadasiz: chegirmangiz <b>{pct}%</b> 🏆",
    boxTitle: "Sovg'a qutisi", boxLeft: "Quti ochilishiga {left} ta buyurtma qoldi",
    how: "Qanday ishlaydi?",
    rules: ["Har bir yakunlangan buyurtmadan {cb}% sovg'a qutingizga tushadi.",
            "Har {be}-buyurtmada quti ochiladi va ichidagi summa bonusingizga o'tadi.",
            "Bonusni naqd olib bo'lmaydi. U faqat keyingi buyurtmalaringizda chegirma sifatida ishlatiladi."],
    close: "Tushunarli", foot: "Ma'lumotlar {ts} holatiga ko'ra"
  },
  uzc: {
    cur: "сўм", levels: ["Янги мижоз", "Доимий мижоз", "Ишончли мижоз", "VIP мижоз"],
    balance: "Ишлатиш мумкин бўлган бонус",
    balanceNote: "Кейинги буюртмангизда автоматик чегирма бўлиб ишлайди (нархнинг {ms}% игача).",
    levelTitle: "Сизнинг чегирмангиз", levelSub: "Қанча кўп буюртма берсангиз, чегирма шунча катта.",
    order: "{n}-буюртма", orderPlus: "{n}+ буюртма",
    next: "Ҳозир чегирмангиз <b>{pct}%</b>. Яна <b>{left}</b> та буюртмадан сўнг <b>{np}%</b> бўлади.",
    max: "Сиз энг юқори даражадасиз: чегирмангиз <b>{pct}%</b> 🏆",
    boxTitle: "Совға қутиси", boxLeft: "Қути очилишига {left} та буюртма қолди",
    how: "Қандай ишлайди?",
    rules: ["Ҳар бир якунланган буюртмадан {cb}% совға қутингизга тушади.",
            "Ҳар {be}-буюртмада қути очилади ва ичидаги сумма бонусингизга ўтади.",
            "Бонусни нақд олиб бўлмайди. У фақат кейинги буюртмаларингизда чегирма сифатида ишлатилади."],
    close: "Тушунарли", foot: "Маълумотлар {ts} ҳолатига кўра"
  },
  kaa: {
    cur: "sum", levels: ["Jańa klient", "Turaqlı klient", "Isenimli klient", "VIP klient"],
    balance: "Paydalanıwǵa bolatuǵın bonus",
    balanceNote: "Keyingi buyırtpańızda avtomat túrde shegirme bolıp isleydi (bahanıń {ms}% ine shekem).",
    levelTitle: "Siziń shegirmeńiz", levelSub: "Qansha kóp buyırtpa berseńiz, shegirme sonsha úlken.",
    order: "{n}-buyırtpa", orderPlus: "{n}+ buyırtpa",
    next: "Házir shegirmeńiz <b>{pct}%</b>. Jáne <b>{left}</b> buyırtpadan soń <b>{np}%</b> boladı.",
    max: "Siz eń joqarı dárejedesiz: shegirmeńiz <b>{pct}%</b> 🏆",
    boxTitle: "Sawǵa qutısı", boxLeft: "Qutı ashılıwına {left} buyırtpa qaldı",
    how: "Qalay isleydi?",
    rules: ["Hár bir juwmaqlanǵan buyırtpadan {cb}% sawǵa qutıńızǵa túsedi.",
            "Hár {be}-buyırtpada qutı ashıladı hám ishindegi summa bonusıńızǵa ótedi.",
            "Bonustı naq pul etip alıwǵa bolmaydı. Ol tek keyingi buyırtpalarıńızda shegirme retinde paydalanıladı."],
    close: "Túsinikli", foot: "Maǵlıwmatlar {ts} jaǵdayına qaray"
  },
  ru: {
    cur: "сум", levels: ["Новый клиент", "Постоянный клиент", "Надёжный клиент", "VIP-клиент"],
    balance: "Доступный бонус",
    balanceNote: "Автоматически станет скидкой на следующий заказ (до {ms}% от стоимости).",
    levelTitle: "Ваша скидка", levelSub: "Чем больше заказов, тем больше скидка.",
    order: "{n}-й заказ", orderPlus: "{n}+ заказов",
    next: "Сейчас ваша скидка <b>{pct}%</b>. Ещё заказов: <b>{left}</b> — и она станет <b>{np}%</b>.",
    max: "У вас максимальный уровень: скидка <b>{pct}%</b> 🏆",
    boxTitle: "Подарочная коробка", boxLeft: "До открытия осталось заказов: {left}",
    how: "Как это работает?",
    rules: ["С каждого завершённого заказа {cb}% попадает в вашу подарочную коробку.",
            "На каждом {be}-м заказе коробка открывается, и сумма переходит в ваш бонус.",
            "Бонус нельзя вывести деньгами. Он используется только как скидка на следующие заказы."],
    close: "Понятно", foot: "Данные по состоянию на {ts}"
  },
  en: {
    cur: "UZS", levels: ["New client", "Regular client", "Trusted client", "VIP client"],
    balance: "Bonus available to use",
    balanceNote: "Applied automatically as a discount on your next order (up to {ms}% of the price).",
    levelTitle: "Your discount", levelSub: "The more you order, the bigger your discount.",
    order: "Order {n}", orderPlus: "{n}+ orders",
    next: "Your discount is now <b>{pct}%</b>. After <b>{left}</b> more order(s) it becomes <b>{np}%</b>.",
    max: "You are at the highest level: your discount is <b>{pct}%</b> 🏆",
    boxTitle: "Gift box", boxLeft: "Orders left until the box opens: {left}",
    how: "How does it work?",
    rules: ["{cb}% of every completed order goes into your gift box.",
            "After every {be} completed orders the box opens and the amount moves to your bonus.",
            "Bonuses cannot be withdrawn as cash. They are used only as a discount on your next orders."],
    close: "Got it", foot: "Data as of {ts}"
  }
};
// Darajalar: [nechanchi buyurtmadan, chegirma %] — bot bilan bir xil bo'lishi kerak (loyalty.py)
const LEVELS = [[1, 0], [2, 5], [3, 7], [5, 10]];

function readData() {
  const fallback = { l: "uz", od: 0, li: 0, pct: 0, nl: 1, np: 5, box: 0, bp: 0, be: 2, bal: 0, cb: 5, ms: 30, ts: "" };
  try {
    const raw = new URLSearchParams(location.search).get("d");
    if (!raw) return fallback;
    const b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
    const bytes = Uint8Array.from(atob(b64 + "=".repeat((4 - b64.length % 4) % 4)), c => c.charCodeAt(0));
    return Object.assign(fallback, JSON.parse(new TextDecoder().decode(bytes)));
  } catch (e) { return fallback; }
}
const fmt = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const fill = (s, d) => s.replace(/\{(\w+)\}/g, (_, k) => d[k]);
const $ = id => document.getElementById(id);

const d = readData();
const T = I18N[d.l] || I18N.uz;
document.documentElement.lang = d.l === "uzc" ? "uz-Cyrl" : d.l;

$("level").textContent = T.levels[d.li] || T.levels[0];
$("t-balance").textContent = T.balance;
$("bal").textContent = fmt(d.bal);
$("cur1").textContent = T.cur;
$("t-balance-note").textContent = fill(T.balanceNote, d);
$("t-level-title").textContent = T.levelTitle;
$("t-level-sub").textContent = T.levelSub;
$("steps").innerHTML = LEVELS.map(([from, pct], i) => {
  const cls = i < d.li ? "done" : i === d.li ? "now" : "";
  const label = fill(i === LEVELS.length - 1 ? T.orderPlus : T.order, { n: from });
  return `<div class="step ${cls}"><i></i><b>${pct}%</b><span>${label}</span></div>`;
}).join("");
$("next").innerHTML = fill(d.li >= LEVELS.length - 1 ? T.max : T.next, { pct: d.pct, left: d.nl, np: d.np });
$("t-box-title").textContent = T.boxTitle;
$("box").textContent = fmt(d.box);
$("cur2").textContent = T.cur;
$("box-left").textContent = fill(T.boxLeft, { left: Math.max(1, d.be - d.bp) });
$("t-how").textContent = T.how;
$("rules").innerHTML = T.rules.map((r, i) => `<li><b>${i + 1}</b><span>${fill(r, d)}</span></li>`).join("");
$("close").textContent = T.close;
$("foot").textContent = d.ts ? fill(T.foot, d) : "";

const C = 2 * Math.PI * 42, bar = $("bar");
bar.style.strokeDasharray = C;
bar.style.strokeDashoffset = C;
requestAnimationFrame(() => { bar.style.strokeDashoffset = C * (1 - Math.min(1, d.bp / d.be)); });

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
document.body.classList.toggle("dark", dark);
$("close").onclick = () => (tg && tg.close ? tg.close() : history.back());
</script>
</body>
</html>
